<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tự giới thiệu - Hùng</title>
    <!-- Thêm thư viện Icon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0d0908 radial-gradient(circle at 50% 10%, rgba(120, 35, 25, 0.35) 0%, rgba(13, 9, 8, 1) 70%);
            color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Card chính */
        .container {
            position: relative;
            background: rgba(28, 20, 20, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 28px;
            padding: 50px 35px 35px;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(120, 35, 25, 0.15);
            margin-top: 40px;
        }

        /* Nút chuyển đổi ngôn ngữ */
        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 6px;
        }

        .lang-btn {
            background: rgba(45, 32, 32, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a0a0a0;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn:hover, .lang-btn.active {
            background: #ff4d4d;
            color: #ffffff;
            border-color: #ff4d4d;
        }

        /* Avatar đè lên mép trên */
        .avatar-box {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #ff6b6b, #4a1515);
            box-shadow: 0 0 25px rgba(255, 107, 107, 0.3);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #1c1414;
        }

        /* Tiêu đề */
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #ff7b7b;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 22px;
            background-color: #ff4d4d;
            border-radius: 2px;
        }

        /* Danh sách thông tin dạng hàng */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .info-item {
            background: rgba(45, 32, 32, 0.4);
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            font-size: 14px;
        }

        .info-label {
            color: #ff6b6b;
            font-weight: 700;
            width: 130px;
            flex-shrink: 0;
        }

        .info-value {
            color: #d1d1d1;
            flex-grow: 1;
        }

        .info-value a {
            color: #d1d1d1;
            text-decoration: none;
            transition: color 0.2s;
        }

        .info-value a:hover {
            color: #ff7b7b;
        }

        /* Lưới các nút liên kết social (3 cột) */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .social-btn {
            background: rgba(45, 32, 32, 0.5);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 8px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.25s ease;
            text-align: center;
        }

        .social-btn:hover {
            background: rgba(255, 107, 107, 0.15);
            border-color: rgba(255, 107, 107, 0.4);
            color: #ff7b7b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* Responsive cho điện thoại nhỏ */
        @media (max-width: 520px) {
            .links-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .social-btn {
                padding: 10px 4px;
                font-size: 11px;
                gap: 4px;
            }
            .info-label {
                width: 90px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bộ chuyển đổi ngôn ngữ -->
        <div class="lang-switch">
            <button class="lang-btn active" onclick="changeLang('vi', this)">VIE</button>
            <button class="lang-btn" onclick="changeLang('en', this)">ENG</button>
            <button class="lang-btn" onclick="changeLang('zh', this)">ZHO</button>
        </div>

        <!-- Ảnh đại diện nổi ở giữa mép trên -->
        <div class="avatar-box">
            <img src="mèo.jpg" alt="Avatar Hùng">
        </div>

        <!-- Tiêu đề -->
        <div class="title" id="txt-title">Tự giới thiệu</div>

        <!-- Khối thông tin -->
        <div class="info-list">
            <div class="info-item">
                <span class="info-label" id="lbl-intro">Giới thiệu</span>
                <span class="info-value" id="val-intro">Thích mày mò công nghệ & làm những thứ hay ho :)))))</span>
            </div>
            <div class="info-item">
                <span class="info-label" id="lbl-name">tên</span>
                <span class="info-value" id="val-name">Hùng</span>
            </div>
            <div class="info-item">
                <span class="info-label" id="lbl-bg">Thiết kế bối cảnh</span>
                <span class="info-value" id="val-bg">Đường nâu</span>
            </div>
            <div class="info-item">
                <span class="info-label" id="lbl-gmail">Gmail</span>
                <span class="info-value" id="val-gmail"><a href="mailto:phambahunggialai@gmail.com">phambahunggialai@gmail.com</a></span>
            </div>
        </div>

        <!-- Nút mạng xã hội (3 cột - 9 nút) -->
        <div class="links-grid">
            <a href="https://www.facebook.com/pham.hung.427949" target="_blank" class="social-btn">
                <i class="fa-brands fa-facebook"></i> Facebook
            </a>
            <a href="https://www.tiktok.com/@hungpham.70" target="_blank" class="social-btn">
                <i class="fa-brands fa-tiktok"></i> TikTok
            </a>
            <a href="https://www.youtube.com/@HungPham-bn5nr" target="_blank" class="social-btn">
                <i class="fa-brands fa-youtube"></i> YouTube
            </a>
            <a href="https://github.com/phambahunggialai-art" target="_blank" class="social-btn">
                <i class="fa-brands fa-github"></i> GitHub
            </a>
            <a href="#" target="_blank" class="social-btn">
                <i class="fa-brands fa-x-twitter"></i> X (Twitter)
            </a>
            <a href="#" target="_blank" class="social-btn">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            <a href="https://space.bilibili.com" target="_blank" class="social-btn">
                <i class="fa-solid fa-tv"></i> Bilibili-C
            </a>
            <a href="https://www.bilibili.tv" target="_blank" class="social-btn">
                <i class="fa-solid fa-globe"></i> Bilibili-G
            </a>
            <a href="https://www.douyin.com" target="_blank" class="social-btn">
                <i class="fa-brands fa-tiktok"></i> Douyin
            </a>
        </div>
    </div>

    <script>
        const translations = {
            vi: {
                title: "Tự giới thiệu",
                introLbl: "Giới thiệu",
                introVal: "Thích mày mò công nghệ & làm những thứ hay ho :)))))",
                nameLbl: "tên",
                nameVal: "Hùng",
                bgLbl: "Thiết kế bối cảnh",
                bgVal: "Đường nâu"
            },
            en: {
                title: "About Me",
                introLbl: "Bio",
                introVal: "Passionate about tech & making cool stuff :)))))",
                nameLbl: "Name",
                nameVal: "Hung",
                bgLbl: "Background Concept",
                bgVal: "Brown Sugar"
            },
            zh: {
                title: "自我介绍",
                introLbl: "简介",
                introVal: "喜欢探索科技 & 做些有趣的事 :)))))",
                nameLbl: "姓名",
                nameVal: "雄 (Hung)",
                bgLbl: "背景设计",
                bgVal: "黑糖 / 红糖"
            }
        };

        function changeLang(lang, btnElement) {
            // Cập nhật text
            document.getElementById('txt-title').innerText = translations[lang].title;
            document.getElementById('lbl-intro').innerText = translations[lang].introLbl;
            document.getElementById('val-intro').innerText = translations[lang].introVal;
            document.getElementById('lbl-name').innerText = translations[lang].nameLbl;
            document.getElementById('val-name').innerText = translations[lang].nameVal;
            document.getElementById('lbl-bg').innerText = translations[lang].bgLbl;
            document.getElementById('val-bg').innerText = translations[lang].bgVal;

            // Đổi màu nút ngôn ngữ active
            const buttons = document.querySelectorAll('.lang-btn');
            buttons.forEach(b => b.classList.remove('active'));
            if (btnElement) {
                btnElement.classList.add('active');
            }
        }
    </script>
</body>
</html>
